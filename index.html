<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Storefront GPT</title>
    <style>
      :root {
        color: #172033;
        background: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 42rem;
        margin: 1.5rem;
        padding: 2.5rem;
        border: 1px solid #d8e0ec;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1.25rem 3rem rgba(23, 32, 51, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #42526b;
        font-size: 1.125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>AI Storefront GPT is live on GitHub Pages.</p>
    </main>
  </body>
</html>
